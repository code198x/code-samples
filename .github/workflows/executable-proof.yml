name: Executable Curriculum Proof

on:
  pull_request:
    paths:
      - "_capture/verify.py"
      - "commodore-amiga/assembly/meet-the-machine/unit-07/**"
      - "sinclair-zx-spectrum/assembly/**/capture/proof.*.json"
      - "sinclair-zx-spectrum/assembly/**/*.asm"
      - "commodore-64/assembly/**/capture/proof.*.json"
      - "commodore-64/assembly/**/*.asm"
      - "nintendo-entertainment-system/assembly/**/capture/proof.*.json"
      - "nintendo-entertainment-system/assembly/**/*.asm"
      - ".github/workflows/executable-proof.yml"
  push:
    branches: [main, master]
    paths:
      - "_capture/verify.py"
      - "commodore-amiga/assembly/meet-the-machine/unit-07/**"
      - "sinclair-zx-spectrum/assembly/**/capture/proof.*.json"
      - "sinclair-zx-spectrum/assembly/**/*.asm"
      - "commodore-64/assembly/**/capture/proof.*.json"
      - "commodore-64/assembly/**/*.asm"
      - "nintendo-entertainment-system/assembly/**/capture/proof.*.json"
      - "nintendo-entertainment-system/assembly/**/*.asm"
      - ".github/workflows/executable-proof.yml"
  workflow_dispatch:

jobs:
  amiga-copper-public:
    name: Amiga Copper public proof
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code198x samples
        uses: actions/checkout@v7

      - name: Read locked revisions
        id: lock
        shell: bash
        run: |
          LOCK=commodore-amiga/assembly/meet-the-machine/unit-07/capture/proof.lock.json
          echo "asm=$(jq -r '.repositories.asm198x.revision' "$LOCK")" >> "$GITHUB_OUTPUT"
          echo "build=$(jq -r '.repositories.build198x.revision' "$LOCK")" >> "$GITHUB_OUTPUT"

      - name: Checkout Asm198x
        uses: actions/checkout@v7
        with:
          repository: asm198x/asm198x
          ref: ${{ steps.lock.outputs.asm }}
          path: _family/Asm198x/asm198x

      - name: Checkout Build198x
        uses: actions/checkout@v7
        with:
          repository: build198x/build198x
          ref: ${{ steps.lock.outputs.build }}
          path: _family/Build198x/build198x

      - name: Build locked family tools
        run: |
          cargo build --release --manifest-path _family/Asm198x/asm198x/Cargo.toml -p asm198x
          cargo build --release --manifest-path _family/Build198x/build198x/Cargo.toml -p build198x

      - name: Verify redistributable stages
        env:
          ROOT198X: ${{ github.workspace }}/_family
          ASM198X: ${{ github.workspace }}/_family/Asm198x/asm198x/target/release/asm198x
          BUILD198X: ${{ github.workspace }}/_family/Build198x/build198x/target/release/build198x
        run: |
          python3 _capture/verify.py \
            commodore-amiga/assembly/meet-the-machine/unit-07/capture/manifest.json \
            --public --report build/proofs/amiga-copper-public.json

      - name: Upload evidence report
        uses: actions/upload-artifact@v7
        with:
          name: amiga-copper-public-proof
          path: build/proofs/amiga-copper-public.json

  # The Spectrum chain is shorter: Asm198x emits a runnable 48K snapshot
  # directly, so there is no media-mastering stage and no Build198x checkout.
  # One matrix leg per proof, so adding a unit is one line rather than a job.
  spectrum-public:
    name: Spectrum ${{ matrix.proof.name }} public proof
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        proof:
          - name: meet-the-machine no-safety-net
            dir: sinclair-zx-spectrum/assembly/meet-the-machine/unit-16
            id: spectrum-meet-the-machine-16
          - name: Gloaming title
            dir: sinclair-zx-spectrum/assembly/gloaming/unit-19
            id: spectrum-gloaming-19
          - name: The Long Night title
            dir: sinclair-zx-spectrum/assembly/the-long-night/unit-10
            id: spectrum-the-long-night-10
          - name: Shadowkeep title
            dir: sinclair-zx-spectrum/assembly/shadowkeep/unit-19
            id: spectrum-shadowkeep-19
    steps:
      - name: Checkout Code198x samples
        uses: actions/checkout@v7

      - name: Read locked revisions
        id: lock
        shell: bash
        run: |
          LOCK=${{ matrix.proof.dir }}/capture/proof.lock.json
          echo "asm=$(jq -r '.repositories.asm198x.revision' "$LOCK")" >> "$GITHUB_OUTPUT"

      - name: Checkout Asm198x
        uses: actions/checkout@v7
        with:
          repository: asm198x/asm198x
          ref: ${{ steps.lock.outputs.asm }}
          path: _family/Asm198x/asm198x

      - name: Build locked family tools
        run: cargo build --release --manifest-path _family/Asm198x/asm198x/Cargo.toml -p asm198x

      - name: Verify redistributable stages
        env:
          ROOT198X: ${{ github.workspace }}/_family
          ASM198X: ${{ github.workspace }}/_family/Asm198x/asm198x/target/release/asm198x
        run: |
          python3 _capture/verify.py \
            ${{ matrix.proof.dir }}/capture/proof.manifest.json \
            --public --report build/proofs/${{ matrix.proof.id }}.json

      - name: Upload evidence report
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.proof.id }}-proof
          path: build/proofs/${{ matrix.proof.id }}.json

  # Same shape as the Spectrum: acme emits a runnable .prg, so no Build198x.
  c64-public:
    name: C64 ${{ matrix.proof.name }} public proof
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        proof:
          - name: Starfield the curve
            dir: commodore-64/assembly/starfield/unit-17
            id: c64-starfield-17
    steps:
      - name: Checkout Code198x samples
        uses: actions/checkout@v7

      - name: Read locked revisions
        id: lock
        shell: bash
        run: |
          LOCK=${{ matrix.proof.dir }}/capture/proof.lock.json
          echo "asm=$(jq -r '.repositories.asm198x.revision' "$LOCK")" >> "$GITHUB_OUTPUT"

      - name: Checkout Asm198x
        uses: actions/checkout@v7
        with:
          repository: asm198x/asm198x
          ref: ${{ steps.lock.outputs.asm }}
          path: _family/Asm198x/asm198x

      - name: Build locked family tools
        run: cargo build --release --manifest-path _family/Asm198x/asm198x/Cargo.toml -p asm198x

      - name: Verify redistributable stages
        env:
          ROOT198X: ${{ github.workspace }}/_family
          ASM198X: ${{ github.workspace }}/_family/Asm198x/asm198x/target/release/asm198x
        run: |
          python3 _capture/verify.py \
            ${{ matrix.proof.dir }}/capture/proof.manifest.json \
            --public --report build/proofs/${{ matrix.proof.id }}.json

      - name: Upload evidence report
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.proof.id }}-proof
          path: build/proofs/${{ matrix.proof.id }}.json

  # The NES has no boot ROM, so this proof has nothing restricted to withhold:
  # its execute stage runs here, and CI compares the rendered frame on every
  # push. The other three machines can only reach their redistributable stages.
  nes-public:
    name: NES ${{ matrix.proof.name }} proof (executes)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        proof:
          - name: Dash
            dir: nintendo-entertainment-system/assembly/dash/unit-17
            id: nes-dash-17
    steps:
      - name: Checkout Code198x samples
        uses: actions/checkout@v7

      - name: Read locked revisions
        id: lock
        shell: bash
        run: |
          LOCK=${{ matrix.proof.dir }}/capture/proof.lock.json
          echo "asm=$(jq -r '.repositories.asm198x.revision' "$LOCK")" >> "$GITHUB_OUTPUT"
          echo "emu=$(jq -r '.repositories.emu198x.revision' "$LOCK")" >> "$GITHUB_OUTPUT"

      - name: Checkout Asm198x
        uses: actions/checkout@v7
        with:
          repository: asm198x/asm198x
          ref: ${{ steps.lock.outputs.asm }}
          path: _family/Asm198x/asm198x

      - name: Checkout Emu198x
        uses: actions/checkout@v7
        with:
          repository: emu198x/emu198x
          ref: ${{ steps.lock.outputs.emu }}
          path: _family/Emu198x/emu198x

      - name: Build locked family tools
        run: |
          cargo build --release --manifest-path _family/Asm198x/asm198x/Cargo.toml -p asm198x
          cargo build --release --manifest-path _family/Emu198x/emu198x/Cargo.toml -p emu198x-nes --no-default-features

      - name: Verify the whole chain, execution included
        env:
          ROOT198X: ${{ github.workspace }}/_family
          ASM198X: ${{ github.workspace }}/_family/Asm198x/asm198x/target/release/asm198x
          EMU198X_NES: ${{ github.workspace }}/_family/Emu198x/emu198x/target/release/emu198x-nes
        run: |
          python3 _capture/verify.py \
            ${{ matrix.proof.dir }}/capture/proof.manifest.json \
            --public --report build/proofs/${{ matrix.proof.id }}.json

      - name: Upload evidence report
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.proof.id }}-proof
          path: build/proofs/${{ matrix.proof.id }}.json
