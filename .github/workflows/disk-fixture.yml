name: Disk qualification fixture
on:
  pull_request:
    paths: ['sinclair-zx-spectrum/qualification/disk-plus3/**', '.github/workflows/disk-fixture.yml']
  push:
    branches: [main]
    paths: ['sinclair-zx-spectrum/qualification/disk-plus3/**', '.github/workflows/disk-fixture.yml']
concurrency:
  group: disk-fixture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s sinclair-zx-spectrum/qualification/disk-plus3 -p 'test_*.py' -v
