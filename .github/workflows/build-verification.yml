          # Output goes to a temporary directory, so the checkout stays clean.
          GENERATED=0
          for PREP in $(find sinclair-zx-spectrum -name prepare.py -type f | sort); do
            FLAGS=$(python3 "$PREP" --help | sed -nE 's/^  (--[a-z0-9-]+)( {2,}.*)?$/\1/p')
            for FLAG in "" $FLAGS; do
              OUT=$(mktemp -d)
              echo "Generating: $PREP $FLAG"
              if ! python3 "$PREP" $FLAG "$OUT" 2>&1 || ! ls "$OUT"/*.asm > /dev/null 2>&1; then
                echo "  FAILED (prepare.py errored or wrote no .asm)"
                FAILED=$((FAILED + 1))
                rm -rf "$OUT"
                continue
              fi
              for GEN in "$OUT"/*.asm; do
                GENBASE=$(basename "$GEN" .asm)
                echo "Building generated: $PREP ${FLAG:+$FLAG }-> $GENBASE.asm"
                GENERATED=$((GENERATED + 1))
                cd "$OUT"
                if pasmonext --tapbas "$(basename "$GEN")" "${GENBASE}.tap" 2>&1; then
                  echo "  OK"
                  PASSED=$((PASSED + 1))
                else
                  echo "  FAILED"
                  FAILED=$((FAILED + 1))
                fi
                cd - > /dev/null
              done
              rm -rf "$OUT"
