            for FLAG in "" $FLAGS; do
              OUT=$(mktemp -d)
              echo "Generating: $PREP $FLAG"
              if ! python3 "$PREP" $FLAG "$OUT" 2>&1 || ! ls "$OUT"/*.asm > /dev/null 2>&1; then
                echo "  FAILED (prepare.py errored or wrote no .asm)"
                FAILED=$((FAILED + 1))
                rm -rf "$OUT"
                continue
              fi
              for GEN in "$OUT"/*.asm; do
                GENBASE=$(basename "$GEN" .asm)
                echo "Building generated: $PREP ${FLAG:+$FLAG }-> $GENBASE.asm"
                GENERATED=$((GENERATED + 1))
                cd "$OUT"
                if vasmm68k_mot -Fhunkexe -o "$GENBASE" "$(basename "$GEN")" 2>&1; then
                  echo "  OK"
                  PASSED=$((PASSED + 1))
                else
                  echo "  FAILED"
                  FAILED=$((FAILED + 1))
                fi
                cd - > /dev/null
              done
              rm -rf "$OUT"
            done
          done

          echo ""
          echo "Amiga Build Summary: $PASSED passed, $FAILED failed ($GENERATED generated by prepare.py)"

          if [ $FAILED -gt 0 ]; then
            exit 1
          fi

  build-nes:
    name: Build NES Assembly
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/code198x/nintendo-nes:latest
      options: --entrypoint /bin/bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build NES assembly files
        run: |
          echo "Building NES assembly files..."
          FAILED=0
          PASSED=0

          for ASM in $(find nintendo-entertainment-system -name "*.asm" -type f ! -path "*/snippets/*"); do
            DIR=$(dirname "$ASM")
            BASENAME=$(basename "$ASM" .asm)

            # A folder with prepare.py holds experiment fragments that
            # prepare.py splices into a full source; they never build alone.
            # The generated sources are assembled below instead.
            if [ -f "$DIR/prepare.py" ]; then
              echo "Skipping fragment: $ASM (assembled via prepare.py)"
              continue
            fi

            echo "Building: $ASM"

            cd "$DIR"

            # Check for linker config
            if [ -f "nes.cfg" ]; then
              CFG="nes.cfg"
            else
              echo "  WARNING: No nes.cfg found, skipping"
              cd - > /dev/null
              continue
            fi

            # Two-step build: assemble then link
            if ca65 "$(basename "$ASM")" -o "${BASENAME}.o" 2>&1 && \
               ld65 -C "$CFG" "${BASENAME}.o" -o "${BASENAME}.nes" 2>&1; then
              echo "  OK"
              PASSED=$((PASSED + 1))
            else
              echo "  FAILED"
              FAILED=$((FAILED + 1))
            fi
            cd - > /dev/null
          done

          # Assemble what each prepare.py generates from its fragments: once
          # with no options, then once per flag its --help lists (e.g. --spaced).
          # Output goes to a temporary directory, so the checkout stays clean.
          GENERATED=0
          for PREP in $(find nintendo-entertainment-system -name prepare.py -type f | sort); do
            # Use the experiment folder's nes.cfg, else the unit's.
            PREPDIR=$(cd "$(dirname "$PREP")" && pwd)
            CFG="$PREPDIR/nes.cfg"
            [ -f "$CFG" ] || CFG="$(dirname "$PREPDIR")/nes.cfg"
            FLAGS=$(python3 "$PREP" --help | sed -nE 's/^  (--[a-z0-9-]+)( {2,}.*)?$/\1/p')
            for FLAG in "" $FLAGS; do
              OUT=$(mktemp -d)
              echo "Generating: $PREP $FLAG"
              if ! python3 "$PREP" $FLAG "$OUT" 2>&1 || ! ls "$OUT"/*.asm > /dev/null 2>&1; then
                echo "  FAILED (prepare.py errored or wrote no .asm)"
                FAILED=$((FAILED + 1))
                rm -rf "$OUT"
                continue
              fi
              for GEN in "$OUT"/*.asm; do
                GENBASE=$(basename "$GEN" .asm)
                echo "Building generated: $PREP ${FLAG:+$FLAG }-> $GENBASE.asm"
                GENERATED=$((GENERATED + 1))
                cd "$OUT"
                if ca65 "$(basename "$GEN")" -o "${GENBASE}.o" 2>&1 && \
                   ld65 -C "$CFG" "${GENBASE}.o" -o "${GENBASE}.nes" 2>&1; then
                  echo "  OK"
                  PASSED=$((PASSED + 1))
                else
                  echo "  FAILED"
                  FAILED=$((FAILED + 1))
                fi
                cd - > /dev/null
              done
              rm -rf "$OUT"
            done
          done

          echo ""
          echo "NES Build Summary: $PASSED passed, $FAILED failed ($GENERATED generated by prepare.py)"

          if [ $FAILED -gt 0 ]; then
            exit 1
          fi

  summary:
    name: Build Summary
    needs: [build-c64, build-zx-spectrum, build-amiga, build-nes]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        env:
          C64_RESULT: ${{ needs.build-c64.result }}
          ZX_RESULT: ${{ needs.build-zx-spectrum.result }}
          AMIGA_RESULT: ${{ needs.build-amiga.result }}
          NES_RESULT: ${{ needs.build-nes.result }}
        run: |
          echo "Build Verification Complete"
          echo ""
          echo "C64:         $C64_RESULT"
          echo "ZX Spectrum: $ZX_RESULT"
          echo "Amiga:       $AMIGA_RESULT"
          echo "NES:         $NES_RESULT"

          if [ "$C64_RESULT" != "success" ] || \
             [ "$ZX_RESULT" != "success" ] || \
             [ "$AMIGA_RESULT" != "success" ] || \
             [ "$NES_RESULT" != "success" ]; then
            echo ""
            echo "One or more builds failed!"
            exit 1
          fi

          echo ""
          echo "All builds successful!"

  trigger-website-rebuild:
    name: Trigger Website Rebuild
    needs: [build-c64, build-zx-spectrum, build-amiga, build-nes]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger website deploy
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          repository: code198x/website
          event-type: code-samples-updated
          client-payload: '{"ref": "${{ github.sha }}", "triggered_by": "code-samples"}'
