name: Build Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-c64:
    name: Build C64 Assembly
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/code198x/commodore-64:latest
      options: --entrypoint /bin/bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build C64 assembly files
        run: |
          echo "Building C64 assembly files..."
          FAILED=0
          PASSED=0

          for ASM in $(find commodore-64 -name "*.asm" -type f ! -path "*/snippets/*"); do
            DIR=$(dirname "$ASM")
            BASENAME=$(basename "$ASM" .asm)

            # A folder with prepare.py holds experiment fragments that
            # prepare.py splices into a full source; they never build alone.
            # The generated sources are assembled below instead.
            if [ -f "$DIR/prepare.py" ]; then
              echo "Skipping fragment: $ASM (assembled via prepare.py)"
              continue
            fi

            echo "Building: $ASM"

            cd "$DIR"
            if acme -f cbm -o "${BASENAME}.prg" "$(basename "$ASM")" 2>&1; then
              echo "  OK"
              PASSED=$((PASSED + 1))
            else
              echo "  FAILED"
              FAILED=$((FAILED + 1))
            fi
            cd - > /dev/null
          done

          # Assemble what each prepare.py generates from its fragments: once
          # with no options, then once per flag its --help lists (e.g. --spaced).
          # Output goes to a temporary directory, so the checkout stays clean.
          GENERATED=0
          for PREP in $(find commodore-64 -name prepare.py -type f | sort); do
            FLAGS=$(python3 "$PREP" --help | sed -nE 's/^  (--[a-z0-9-]+)( {2,}.*)?$/\1/p')
            for FLAG in "" $FLAGS; do
              OUT=$(mktemp -d)
              echo "Generating: $PREP $FLAG"
              if ! python3 "$PREP" $FLAG "$OUT" 2>&1 || ! ls "$OUT"/*.asm > /dev/null 2>&1; then
                echo "  FAILED (prepare.py errored or wrote no .asm)"
                FAILED=$((FAILED + 1))
                rm -rf "$OUT"
                continue
              fi
              for GEN in "$OUT"/*.asm; do
                GENBASE=$(basename "$GEN" .asm)
                echo "Building generated: $PREP ${FLAG:+$FLAG }-> $GENBASE.asm"
                GENERATED=$((GENERATED + 1))
                cd "$OUT"
                if acme -f cbm -o "${GENBASE}.prg" "$(basename "$GEN")" 2>&1; then
                  echo "  OK"
                  PASSED=$((PASSED + 1))
                else
                  echo "  FAILED"
                  FAILED=$((FAILED + 1))
                fi
                cd - > /dev/null
              done
              rm -rf "$OUT"
            done
          done

          echo ""
          echo "C64 Build Summary: $PASSED passed, $FAILED failed ($GENERATED generated by prepare.py)"

          if [ $FAILED -gt 0 ]; then
            exit 1
          fi

