  build-amiga:
    name: Build Amiga Assembly
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/code198x/commodore-amiga:latest
      options: --entrypoint /bin/bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Amiga assembly files
        run: |
          echo "Building Amiga assembly files..."
          FAILED=0
          PASSED=0

          for ASM in $(find commodore-amiga -name "*.asm" -type f ! -path "*/snippets/*"); do
            DIR=$(dirname "$ASM")
            BASENAME=$(basename "$ASM" .asm)

            # A folder with prepare.py holds experiment fragments that
            # prepare.py splices into a full source; they never build alone.
            # The generated sources are assembled below instead.
            if [ -f "$DIR/prepare.py" ]; then
              echo "Skipping fragment: $ASM (assembled via prepare.py)"
              continue
            fi

            echo "Building: $ASM"

            cd "$DIR"
            if vasmm68k_mot -Fhunkexe -o "$BASENAME" "$(basename "$ASM")" 2>&1; then
              echo "  OK"
              PASSED=$((PASSED + 1))
            else
              echo "  FAILED"
              FAILED=$((FAILED + 1))
            fi
            cd - > /dev/null
          done

          # Assemble what each prepare.py generates from its fragments: once
          # with no options, then once per flag its --help lists (e.g. --spaced).
          # Output goes to a temporary directory, so the checkout stays clean.
          GENERATED=0
          for PREP in $(find commodore-amiga -name prepare.py -type f | sort); do
