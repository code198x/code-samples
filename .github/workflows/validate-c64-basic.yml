name: Validate C64 BASIC Code

on:
  push:
    branches: [ main, master ]
    paths:
      - 'commodore-64/**/*.bas'
      - 'scripts/validate-c64-basic.py'
      - 'scripts/validate-bas.sh'
      - 'scripts/c64-basic-negative-cases.json'
      - 'scripts/test_c64_basic_validator.py'
      - 'scripts/ci/apt-install.sh'
      - '.github/workflows/validate-c64-basic.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'commodore-64/**/*.bas'
      - 'scripts/validate-c64-basic.py'
      - 'scripts/validate-bas.sh'
      - 'scripts/c64-basic-negative-cases.json'
      - 'scripts/test_c64_basic_validator.py'
      - 'scripts/ci/apt-install.sh'
      - '.github/workflows/validate-c64-basic.yml'

concurrency:
  group: validate-c64-basic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    # Bounded, retried and moved to another mirror on each retry: a slow or
    # unreachable Ubuntu mirror otherwise stalls the job for twenty minutes.
    - name: Install VICE (includes petcat)
      run: bash scripts/ci/apt-install.sh vice

    - name: Test literal handling and required negative controls
      run: python3 scripts/test_c64_basic_validator.py

    - name: Find and validate C64 BASIC files
      run: |
        echo "🔍 Finding C64 BASIC .bas files..."
        BASFILES=$(find commodore-64 -name "*.bas" -type f)

        if [ -z "$BASFILES" ]; then
          echo "✅ No .bas files found to validate"
          exit 0
        fi

        echo "Found $(echo "$BASFILES" | wc -l) .bas files to validate"
        echo ""

        FAILED=0
        PASSED=0

        for BASFILE in $BASFILES; do
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Validating: $BASFILE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          VALIDATION_ARGS=()
          if [ "$BASFILE" = 'commodore-64/basic/meet-c64-basic/unit-15/steps/step-02.bas' ]; then
            VALIDATION_ARGS+=(--negative-fixture)
          fi
          if ./scripts/validate-bas.sh "$BASFILE" "${VALIDATION_ARGS[@]}"; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
            echo "❌ FAILED: $BASFILE"
          fi

          echo ""
        done

        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "VALIDATION SUMMARY"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "✅ Passed: $PASSED"
        echo "❌ Failed: $FAILED"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        if [ $FAILED -gt 0 ]; then
          echo ""
          echo "❌ Validation failed for $FAILED file(s)"
          echo "Please fix the errors above and commit again"
          exit 1
        fi

        echo ""
        echo "✅ All C64 BASIC files validated successfully!"

    - name: Upload validation report
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: validation-failures
        path: |
          **/*.bas
        retention-days: 7
