  assembly-map-gaps:
    name: Four assembly map ports and corruption controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Check native records and reject falsified results
