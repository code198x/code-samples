name: Pattern evidence

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capability-inventory:
    name: Retained capability evidence (30 machines)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Validate the complete retained inventory
        run: python scripts/check-capability-coverage.py
      - name: Prove incomplete and altered claims fail
        run: python -m unittest discover -s scripts -p test_capability_coverage.py -v

  recorded-inputs:
    name: Recorded pattern inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Compare the five selected records with their inputs
        run: python scripts/check-pattern-evidence.py --output "$RUNNER_TEMP/pattern-evidence/recorded-inputs.json"
      - name: Validate all eight routine-audit records and failure controls
        run: |
          python scripts/check-pattern-evidence.py --audit --output "$RUNNER_TEMP/pattern-evidence/routine-audit-inputs.json"
          python -m unittest discover -s scripts -p test_routine_audit.py -v
      - name: Check adventure-parser evidence and configuration controls
        run: |
          python scripts/check-pattern-evidence.py --parser --output "$RUNNER_TEMP/pattern-evidence/parser-recorded-inputs.json"
          python -m unittest discover -s scripts -p test_adventure_parser.py -v
      - name: Check rendering-family records and guard failure modes
        run: |
          python scripts/check-rendering-evidence.py
          python -m unittest discover -s scripts -p test_rendering_evidence.py -v
      - name: Check sprite-lifecycle records and failure controls
        run: |
          python scripts/check-sprite-lifecycle.py
          python -m unittest discover -s scripts -p test_sprite_lifecycle.py -v
      - name: Check four fixed-character callers and corruption controls
        run: |
          python scripts/check-fixed-characters.py
          python -m unittest discover -s scripts -p test_fixed_characters.py -v
      - name: Check guard failure modes
        run: python -m unittest discover -s scripts -p test_pattern_evidence.py -v
      - name: Verify clipping evidence bindings and failure modes
        run: |
          python scripts/check-sprite-clipping.py
          python -m unittest discover -s scripts -p test_sprite_clipping.py -v
      - name: Verify prepared assets and phase evidence bindings
        run: |
          python cross-platform/patterns/rendering/pre-shifted-sprites/verification/verify.py --output "$RUNNER_TEMP/pattern-evidence/prepared-phases.json"
          python scripts/check-sprite-phases.py
          python -m unittest discover -s scripts -p test_sprite_phases.py -v
      - name: Verify thirty-system tile-map evidence and failure controls
        run: |
          python scripts/check-tilemaps.py
          python -m unittest discover -s scripts -p test_tilemaps.py -v
      - name: Verify nine native VDP region implementations
        run: |
          python scripts/check-tile-regions.py
          python -m unittest discover -s scripts -p test_tile_regions.py -v
      - name: Check bitmap-region evidence and isolated rejection controls
        run: |
          python scripts/check-bitmap-regions.py
          python -m unittest discover -s scripts -p test_bitmap_regions.py -v
      - name: Check character and Electron regions with failure controls
        run: |
          python scripts/check-character-regions.py
          python -m unittest discover -s scripts -p test_character_regions.py -v
      - name: Check native adapters and backend failure controls
        run: |
          python scripts/check-region-architectures.py
          python -m unittest discover -s scripts -p test_region_architectures.py -v
      - name: Check six-machine pixels and glyphs against independent retained models
        run: |
          python scripts/check-drawing-foundations.py
          python -m unittest discover -s scripts -p test_drawing_foundations.py -v
      - name: Check Ace, Oric TEXT and Atari character RAM with corruption controls
        run: |
          python scripts/check-character-ram-ports.py
          python -m unittest discover -s scripts -p test_character_ram_ports.py -v
      - name: Check four native character backends and corruption controls
        run: |
          python scripts/check-native-glyphs.py
          python -m unittest discover -s scripts -p test_native_glyphs.py -v
      - name: Check six TMS glyph ports and independent corruption controls
        run: |
          python scripts/check-tms-glyphs.py
          python -m unittest discover -s scripts -p test_tms_glyphs.py -v
      - name: Check four native geometry backends and corruption controls
        run: |
          python scripts/check-geometry.py
          python -m unittest discover -s scripts -p test_geometry.py -v
      - name: Check arbitrary-position bitmap text and corruption controls
        run: |
          python scripts/check-bitmap-text.py
          python -m unittest discover -s scripts -p test_bitmap_text.py -v
      - name: Check Oric and ANTIC drawing with corruption controls
        run: |
          python scripts/check-extended-primitives.py
          python -m unittest discover -s scripts -p test_extended_primitives.py -v
      - name: Check Atom, Electron, C64 and Amiga primitives with failure controls
        run: |
          python scripts/check-remaining-primitives.py
          python -m unittest discover -s scripts -p test_remaining_primitives.py -v
      - name: Check Amiga wide-pointer bitmap text and corruption controls
        run: |
          python scripts/check-amiga-bitmap-text.py
          python -m unittest discover -s scripts -p test_amiga_bitmap_text.py -v
      - name: Check retained TIA and MARIA drawing evidence and corruption controls
        run: |
          python scripts/check-tia-maria-records.py
          python -m unittest discover -s scripts -p test_tia_maria.py -v
      - name: Check retained bounded text layout and diagnostic repairs
        run: |
          python scripts/check-text-layout.py
          python -m unittest discover -s scripts -p test_text_layout.py -v
      - name: Check proportional advance, layout and corruption controls
        run: |
          python scripts/check-proportional-text.py
          python -m unittest discover -s scripts -p test_proportional_text.py -v
      - name: Check word-aware text layout and corruption controls
        run: |
          python scripts/check-word-wrap.py
          python -m unittest discover -s scripts -p test_word_wrap.py -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pattern-recorded-inputs
          path: ${{ runner.temp }}/pattern-evidence/recorded-inputs.json
          if-no-files-found: error
          retention-days: 14

  aabb-behaviour:
    name: AABB fresh behaviour
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Execute the independent pixel-oracle checks and negative cases
        run: python cross-platform/patterns/physics/aabb-collision/verification/verify.py --output "$RUNNER_TEMP/pattern-evidence/aabb"
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: pattern-aabb-fresh-behaviour
          path: ${{ runner.temp }}/pattern-evidence/aabb/results.json
          if-no-files-found: error
          retention-days: 14

  scaled-text-records:
    name: Scaled bitmap text records and failure controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Compare complete native observations with independent scaled pixels
        run: python scripts/check-scaled-text.py
      - name: Reject missing, altered and falsely repaired evidence
        run: python -m unittest discover -s scripts -p test_scaled_text.py -v

  spectrum-behaviour:
    name: Spectrum fresh behaviour (released tools)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ASM198X_TAG: asm198x-v0.0.65
      EMU198X_TAG: v0.34.0
      ASM198X_ARCHIVE_SHA256: '02cd6c868f100a37d46fe6283927b13583594e620f966c0865f3f0a705f2d20e'
      EMU198X_ARCHIVE_SHA256: 'dd7d757a61532203eb9e22e2237fa7b436a9dd284c2d019896937ba59671b468'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Download and verify pinned release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pattern-tools"
          cd "$RUNNER_TEMP/pattern-tools"
          asm_archive=asm198x-x86_64-unknown-linux-gnu.tar.xz
          emu_archive=emu198x-spectrum-x86_64-unknown-linux-gnu.tar.gz
          curl --fail --silent --show-error --location --max-time 45 \
            "https://github.com/asm198x/asm198x/releases/download/$ASM198X_TAG/$asm_archive" -o "$asm_archive"
          curl --fail --silent --show-error --location --max-time 45 \
            "https://github.com/emu198x/emu198x/releases/download/$EMU198X_TAG/$emu_archive" -o "$emu_archive"
          printf '%s  %s\n' "$ASM198X_ARCHIVE_SHA256" "$asm_archive" | sha256sum --check --strict
          printf '%s  %s\n' "$EMU198X_ARCHIVE_SHA256" "$emu_archive" | sha256sum --check --strict
          # The same checksum command must reject a deliberately wrong digest.
          if printf '%064d  %s\n' 0 "$asm_archive" | sha256sum --check --status; then
            echo 'Checksum control accepted an incorrect digest' >&2
            exit 1
          fi
          tar -xJf "$asm_archive"
          tar -xzf "$emu_archive"
          mkdir -p bin
          install -m 755 asm198x-x86_64-unknown-linux-gnu/asm198x bin/asm198x
          install -m 755 emu198x-spectrum-x86_64-unknown-linux-gnu/emu198x-spectrum bin/emu198x-spectrum
          echo "$RUNNER_TEMP/pattern-tools/bin" >> "$GITHUB_PATH"
      - name: Execute exhaustive bitmap outputs and timing probes
        run: python sinclair-zx-spectrum/patterns/assembly/rendering/bitmap-addressing/verification/verify.py --output "$RUNNER_TEMP/pattern-evidence/spectrum"
      - name: Execute Spectrum rectangle and overlap lifecycle checks
        run: python scripts/verify-spectrum-lifecycle.py --emulator "$RUNNER_TEMP/pattern-tools/bin/emu198x-spectrum" --output "$RUNNER_TEMP/pattern-evidence/sprite-lifecycle"
      - name: Execute the counted-byte adventure parser
        run: python scripts/verify-z80-adventure-parser.py --emulator "$RUNNER_TEMP/pattern-tools/bin/emu198x-spectrum" --output "$RUNNER_TEMP/pattern-evidence/adventure-parser"
      - name: Execute signed clipping and cropped-image checks
        run: python scripts/verify-spectrum-clipping.py --emulator emu198x-spectrum --output "$RUNNER_TEMP/pattern-evidence/spectrum-clipping"
      - name: Execute pixel-positioned phase checks
        run: python scripts/verify-spectrum-phases.py --emulator emu198x-spectrum --output "$RUNNER_TEMP/pattern-evidence/spectrum-phases"
      - name: Record the released tool combination and host
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path
          report = {
              "samples_revision": os.environ["GITHUB_SHA"],
              "runner_os": os.environ["RUNNER_OS"],
              "host": platform.platform(),
              "python": platform.python_version(),
              "release_tags": {"asm198x": os.environ["ASM198X_TAG"], "emu198x-spectrum": os.environ["EMU198X_TAG"]},
              "linux_archive_sha256": {"asm198x": os.environ["ASM198X_ARCHIVE_SHA256"], "emu198x-spectrum": os.environ["EMU198X_ARCHIVE_SHA256"]},
              "incorrect_checksum_rejected": True,
              "limits": "This Ubuntu x86-64 tool pair and 48K PAL RAM-snapshot fixture only; no ROM boot, contention, hardware or family-wide version-set qualification."
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "pattern-evidence/spectrum-release-inputs.json"
          path.write_text(json.dumps(report, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: pattern-spectrum-fresh-behaviour
          path: |
            ${{ runner.temp }}/pattern-evidence/spectrum/results.json
            ${{ runner.temp }}/pattern-evidence/spectrum-release-inputs.json
            ${{ runner.temp }}/pattern-evidence/spectrum-clipping/results.json
            ${{ runner.temp }}/pattern-evidence/spectrum-phases/results.json
            ${{ runner.temp }}/pattern-evidence/adventure-parser/results.json
            ${{ runner.temp }}/pattern-evidence/sprite-lifecycle/results.json
          if-no-files-found: error
          retention-days: 14

  nes-behaviour:
    name: NES fresh audio behaviour (released tools)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ASM198X_TAG: asm198x-v0.0.65
      EMU198X_TAG: v0.34.0
      ASM198X_ARCHIVE_SHA256: '02cd6c868f100a37d46fe6283927b13583594e620f966c0865f3f0a705f2d20e'
      EMU198X_ARCHIVE_SHA256: '2e29c5bdedd54e361fce571844e8fbb70cc38c0e95dfbac2f086b0cca2021f14'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Download and verify pinned release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pattern-tools"
          cd "$RUNNER_TEMP/pattern-tools"
          asm_archive=asm198x-x86_64-unknown-linux-gnu.tar.xz
          emu_archive=emu198x-nes-x86_64-unknown-linux-gnu.tar.gz
          curl --fail --silent --show-error --location --max-time 45 \
            "https://github.com/asm198x/asm198x/releases/download/$ASM198X_TAG/$asm_archive" -o "$asm_archive"
          curl --fail --silent --show-error --location --max-time 45 \
            "https://github.com/emu198x/emu198x/releases/download/$EMU198X_TAG/$emu_archive" -o "$emu_archive"
          printf '%s  %s\n' "$ASM198X_ARCHIVE_SHA256" "$asm_archive" | sha256sum --check --strict
          printf '%s  %s\n' "$EMU198X_ARCHIVE_SHA256" "$emu_archive" | sha256sum --check --strict
          # The same checksum command must reject a deliberately wrong digest.
          if printf '%064d  %s\n' 0 "$asm_archive" | sha256sum --check --status; then
            echo 'Checksum control accepted an incorrect digest' >&2
            exit 1
          fi
          tar -xJf "$asm_archive"
          tar -xzf "$emu_archive"
          mkdir -p bin
          install -m 755 asm198x-x86_64-unknown-linux-gnu/asm198x bin/asm198x
          install -m 755 emu198x-nes-x86_64-unknown-linux-gnu/emu198x-nes bin/emu198x-nes
          echo "$RUNNER_TEMP/pattern-tools/bin" >> "$GITHUB_PATH"
      - name: Execute OAM packing and camera-wrap controls
        run: python scripts/verify-nes-rendering.py --emulator "$RUNNER_TEMP/pattern-tools/bin/emu198x-nes" --output "$RUNNER_TEMP/pattern-evidence/nes-rendering"
      - name: Execute seven pulse-audio cases and WAV-header controls
        run: python nintendo-entertainment-system/patterns/assembly/audio/square-wave/verification/verify.py --emulator "$RUNNER_TEMP/pattern-tools/bin/emu198x-nes" --output "$RUNNER_TEMP/pattern-evidence/nes"
      - name: Record the released tool combination and host
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path
          result_path = Path(os.environ["RUNNER_TEMP"]) / "pattern-evidence/nes/results.json"
          result = json.loads(result_path.read_text())
          expected = {"held-a4", "octave", "low-negate-sweep", "low-sweep-00-mutes", "timer-below-8-mutes", "load-before-enable", "length-expires"}
          if result["status"] != "passed" or len(result["cases"]) != 7 or {c["name"] for c in result["cases"]} != expected:
              raise ValueError("NES run must pass all seven declared cases")
          if set(result["negative_control"]["rejections"]) != {"duration", "pitch"} or not all(result["negative_control"]["rejections"].values()):
              raise ValueError("Both deliberately incorrect WAV-header checks must reject")
          report = {
              "samples_revision": os.environ["GITHUB_SHA"],
              "runner_os": os.environ["RUNNER_OS"],
              "host": platform.platform(),
              "python": platform.python_version(),
              "release_tags": {"asm198x": os.environ["ASM198X_TAG"], "emu198x-nes": os.environ["EMU198X_TAG"]},
              "linux_archive_sha256": {"asm198x": os.environ["ASM198X_ARCHIVE_SHA256"], "emu198x-nes": os.environ["EMU198X_ARCHIVE_SHA256"]},
              "incorrect_checksum_rejected": True,
              "limits": "This Ubuntu x86-64 released pair and NTSC NROM/rendering-off pulse-1 fixture only; no PAL/Dendy, other mapper, hardware, listening or family-wide version-set qualification."
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "pattern-evidence/nes-release-inputs.json"
          path.write_text(json.dumps(report, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: pattern-nes-fresh-behaviour
          path: |
            ${{ runner.temp }}/pattern-evidence/nes/results.json
            ${{ runner.temp }}/pattern-evidence/nes-rendering/results.json
            ${{ runner.temp }}/pattern-evidence/nes-release-inputs.json
          if-no-files-found: error
          retention-days: 14
